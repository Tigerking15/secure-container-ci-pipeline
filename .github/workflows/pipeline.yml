name: Secure Container CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write
  pull-requests: write
  issues: write

env:
  REGISTRY: ghcr.io

jobs:
  policy-unit-tests:
    name: Verify Rego Policies (Unit Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Conftest
        run: |
          CONFTEST_VERSION=0.56.0
          curl -sSL -o conftest.tar.gz "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          tar xzf conftest.tar.gz
          sudo mv conftest /usr/local/bin

      - name: Run Rego Policy Unit Tests
        run: conftest verify -p policy

  build-scan-sign:
    name: Build, Scan, SBOM & Sign
    needs: policy-unit-tests
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: vars
        run: |
          IMAGE="${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ github.sha }}
            ${{ steps.vars.outputs.image }}:latest

      - name: Trivy scan (JSON report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ steps.vars.outputs.image }}@${{ steps.build.outputs.digest }}"
          format: json
          output: trivy-report.json
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
          exit-code: "0"

      - name: Trivy scan (SARIF for code scanning)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ steps.vars.outputs.image }}@${{ steps.build.outputs.digest }}"
          format: sarif
          output: trivy-results.sarif
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
          exit-code: "0"

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: "${{ steps.vars.outputs.image }}@${{ steps.build.outputs.digest }}"
          format: cyclonedx-json
          output-file: sbom.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with Cosign (keyless)
        run: |
          cosign sign --yes "${{ steps.vars.outputs.image }}@${{ steps.build.outputs.digest }}"

      - name: Attach SBOM as signed attestation
        run: |
          cosign attest --yes \
            --predicate sbom.json \
            --type cyclonedx \
            "${{ steps.vars.outputs.image }}@${{ steps.build.outputs.digest }}"

      - name: Verify Cosign signature
        id: verify
        run: |
          if cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ steps.vars.outputs.image }}@${{ steps.build.outputs.digest }}" > cosign-verify.json; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build facts.json for policy gate
        run: |
          python3 scripts/build-facts.py \
            --trivy-report trivy-report.json \
            --signed "${{ steps.verify.outputs.signed }}" \
            --out facts.json
          cat facts.json

      - name: Upload pipeline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-artifacts
          path: |
            facts.json
            sbom.json
            trivy-report.json
            trivy-results.sarif
            cosign-verify.json
          retention-days: 14

  policy-gate:
    name: OPA/Conftest Policy Gate
    needs: build-scan-sign
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download pipeline artifacts
        uses: actions/download-artifact@v4
        with:
          name: pipeline-artifacts

      - name: Install Conftest
        run: |
          CONFTEST_VERSION=0.56.0
          curl -sSL -o conftest.tar.gz "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          tar xzf conftest.tar.gz
          sudo mv conftest /usr/local/bin

      - name: Show facts under evaluation
        run: cat facts.json

      - name: Run policy gate
        id: conftest
        shell: bash
        run: |
          set +e
          conftest test facts.json -p policy/deny.rego 2>&1 | tee conftest-output.txt
          GATE_EXIT_CODE=${PIPESTATUS[0]}
          echo "gate_exit_code=$GATE_EXIT_CODE" >> "$GITHUB_OUTPUT"
          set -e

      - name: Generate Security Report
        if: always()
        run: |
          python3 scripts/generate-summary.py \
            --facts facts.json \
            --sbom sbom.json \
            --trivy-report trivy-report.json \
            --conftest-output conftest-output.txt \
            --image-ref "${{ needs.build-scan-sign.outputs.image }}@${{ needs.build-scan-sign.outputs.digest }}" \
            --out summary.md
          cat summary.md >> $GITHUB_STEP_SUMMARY

      - name: Post or Update PR Security Comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('summary.md')) {
              console.log('No summary.md found, skipping PR comment.');
              return;
            }
            const summary = fs.readFileSync('summary.md', 'utf8');
            const header = '## 🛡️ Container Supply Chain Security Report';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c => c.body && c.body.includes(header));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: summary
              });
              console.log('Updated existing PR security comment.');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: summary
              });
              console.log('Created new PR security comment.');
            }

      - name: Enforce Gate Result
        run: |
          if [ "${{ steps.conftest.outputs.gate_exit_code }}" -ne 0 ]; then
            echo "❌ Policy gate failed with exit code ${{ steps.conftest.outputs.gate_exit_code }}. Deployment blocked."
            exit ${{ steps.conftest.outputs.gate_exit_code }}
          fi
          echo "✅ Policy gate passed."

  deploy:
    name: Deploy (simulated)
    needs: policy-gate
    runs-on: ubuntu-latest
    steps:
      - name: Simulated deployment
        run: |
          echo "Policy gate passed: image is signed and free of critical CVEs."
          echo "Deploying image ${{ needs.build-scan-sign.outputs.image }}@${{ needs.build-scan-sign.outputs.digest }}..."
          echo "deployed at $(date -u +%Y-%m-%dT%H:%M:%SZ) -> ${{ needs.build-scan-sign.outputs.image }}@${{ needs.build-scan-sign.outputs.digest }}" > deployed.marker
          cat deployed.marker

      - name: Upload deployment marker
        uses: actions/upload-artifact@v4
        with:
          name: deployment-marker
          path: deployed.marker
